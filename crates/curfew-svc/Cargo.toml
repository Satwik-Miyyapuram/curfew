[package]
name = "curfew-svc"
description = "The Curfew Windows service: the enforcement loop, its control channel, and its installer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "curfew"
path = "src/main.rs"

[dependencies]
curfew-core = { path = "../curfew-core" }
curfew-win = { path = "../curfew-win" }
curfew-cli = { path = "../curfew-cli" }
curfew-sync = { path = "../curfew-sync" }
serde.workspace = true
serde_json.workspace = true
chrono = { workspace = true, features = ["clock"] }
interprocess = "2.4"
ureq = { version = "3.2.1", default-features = false, features = ["native-tls"] }

[target.'cfg(windows)'.dependencies]
windows-service = "0.7"
# The control pipe's DACL is written as SDDL, and interprocess wants it as a wide C string.
widestring = "1.1"
