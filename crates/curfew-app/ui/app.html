<!doctype html>
<html lang="en" data-theme="light" data-motion="ok">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Curfew</title>
<style>
/* ==================================================================================================
   Curfew desktop — neo-brutalist visual system (docs/design.md §3)

   Square corners unless something is genuinely circular (the time setter, a status dot, the
   countdown ring). No borders, no shadows: blocks are told apart by flat steps of tone. Flat, high-contrast colour
   blocks. No gradients, no blur, no glass, no pills.

   Every colour below is a semantic token: screens never name a raw colour, they name a meaning
   (`brand`, `run`, `ok`, `warn`, `bad`, `cal`), so the dark theme is one block of overrides rather
   than a second visual language.
   ================================================================================================== */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  /* --- colour (docs/design.md §3.2) --- */
  --bg:#F4F1E8; --panel:#FFFFFF; --raise:#EAE6DA; --raise2:#DCD7C8;
  --line:#18181B; --ink:#09090B; --mut:#52525B; --dim:#71717A;
  --brand:#FFD60A; --link:#8A6A00; --run:#FF6A2B; --ok:#16A34A; --warn:#FFAA00; --bad:#F0283F; --cal:#12B5D3;

  /* Tints are the only permitted mixing: flat colour at low alpha over the paper background. No
     gradients are built from them; they exist so a status block can be a colour without shouting. */
  --brand-t:rgba(255,214,10,.22); --run-t:rgba(255,106,43,.16); --ok-t:rgba(22,163,74,.14);
  --warn-t:rgba(255,170,0,.20); --bad-t:rgba(240,40,63,.14); --cal-t:rgba(18,181,211,.16);

  /* Ink on a filled block, chosen per fill for 4.5:1 (WCAG AA). Every fill is vivid, so every fill
     takes dark ink. `--link` is the accent when it has to be read as text on paper. */
  --on-accent:#09090B; --on-brand:#09090B; --on-bad:#09090B;

  /* --- type (docs/design.md §3.3) --- */
  --f:"Segoe UI Variable Text","Segoe UI",-apple-system,"Inter","Helvetica Neue",Arial,sans-serif;
  --fmono:"Cascadia Mono","Consolas","SFMono-Regular","Segoe UI Mono",ui-monospace,monospace;
  --micro:11px; --meta:12.5px; --body:14.5px; --h3:16px; --h2:20px; --h1:26px;
  --display:36px; --mega:46px;
  --sp-xxs:2px; --sp-xs:4px; --sp-s:8px; --sp-m:12px; --sp-l:16px; --sp-xl:24px; --sp-xxl:32px;
  --track-w:700; --track-w2:650;

  /* --- geometry (docs/design.md §3.4) --- */
  --bw:0px; --sh-hero:none; --sh-ctl:none;
  --pad:16px; --row-y:12px; --ctl-h:38px; --gap:var(--sp-l);

  --grid:24px;              /* paper grid pitch */
  --grid-ink:rgba(17,17,16,.055);
  --grid-ink-2:rgba(17,17,16,.10);
  --scrim:rgba(17,17,16,.62);
}
/* Dark theme: the same semantic relationships, pure black surfaces and near-white ink
   (docs/design.md §3.2). Page and panels are both #000 for AMOLED; only controls (`raise`) get a
   near-black tone. Not a second language — only the token block changes. */
html[data-theme="dark"]{
  --bg:#000000; --panel:#000000; --raise:#141416; --raise2:#232327;
  --line:#333333; --ink:#FAFAFA; --mut:#A3A3A3; --dim:#8A8A8A;
  --brand:#FFD60A; --link:#FFD60A; --run:#FF8A4D; --ok:#4FC183; --warn:#E8B33A; --bad:#FF667E; --cal:#3BB8CE;
  --brand-t:rgba(255,214,10,.20); --run-t:rgba(255,138,77,.20); --ok-t:rgba(79,193,131,.18);
  --warn-t:rgba(232,179,58,.20); --bad-t:rgba(255,102,126,.20); --cal-t:rgba(59,184,206,.20);
  --on-accent:#000000; --on-brand:#000000; --on-bad:#000000;
  --grid-ink:rgba(250,250,250,.05); --grid-ink-2:rgba(250,250,250,.09); --scrim:rgba(0,0,0,.72);
}
html[data-scale="90"]{font-size:90%}
html[data-scale="100"]{font-size:100%}
html[data-scale="115"]{font-size:115%}
html[data-scale="130"]{font-size:130%}
/* High contrast: pure black on pure white, heavier rules. */
html[data-contrast="high"]{--grid-ink:transparent;--grid-ink-2:transparent;--scrim:rgba(17,17,16,.86)}
html[data-contrast="high"]{--bw:3px}
html[data-contrast="high"][data-theme="light"]{--bg:#FFFFFF;--panel:#FFFFFF;--raise:#F0F0F0;--ink:#000000;--line:#000000;--mut:#333333;--dim:#444444}
html[data-contrast="high"][data-theme="dark"]{--bg:#000000;--panel:#0A0A0A;--raise:#141414;--line:#FFFFFF;--ink:#FFFFFF;--mut:#DDDDDD;--dim:#BBBBBB}
/* Reduced motion (§8): only the transitions this page owns are switched off. */
html[data-motion="calm"] *{transition:none !important;animation:none !important}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}

html,body{height:100%}
body{
  background-color:var(--bg);
  color:var(--ink);font-family:var(--f);font-size:var(--body);line-height:1.45;
  -webkit-font-smoothing:antialiased;overflow:hidden;user-select:none;
}
/* Text the user may need to copy is selectable again.
   `user-select:none` on the body is right for a window whose controls are divs — it stops a click
   dragging a blue smear across the chrome — but it also stopped anyone copying the one thing this
   window prints *in order to be copied*: the path of the config the service actually reads, and the
   command that edits it. Telling a user to run a command they cannot select is not an instruction. */
.body,.sheet,.mono,.flush,.card{user-select:text}
/* Focus. 3px brand outline with a visible offset, on one selector list so no control can be missed
   (docs/design.md §3.5, §8). */
:focus{outline:none}
:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,
a:focus-visible,summary:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--link);outline-offset:3px;border-radius:0}

/* ------------------------------------------------------------------ typography */
h1,.h1{font-size:var(--h1);font-weight:800;text-transform:uppercase;letter-spacing:-.2px;line-height:1.15}
h2,.h2{font-size:var(--h2);font-weight:800;text-transform:uppercase;letter-spacing:-.1px;line-height:1.2}
h3,.h3{font-size:var(--h3);font-weight:750;text-transform:uppercase;letter-spacing:.3px;line-height:1.25}
.display{font-size:var(--display);font-weight:800;text-transform:uppercase;line-height:1.05;letter-spacing:-.5px}
.mega{font-size:var(--mega);font-weight:800;line-height:1;letter-spacing:-1px}
.mono{font-family:var(--fmono);font-variant-numeric:tabular-nums;letter-spacing:-.2px}
.lbl{font-family:var(--fmono);font-size:var(--micro);font-weight:700;letter-spacing:1.4px;
  text-transform:uppercase;color:var(--dim)}
.sub{font-size:var(--body);color:var(--mut);line-height:1.55;max-width:74ch}
.meta{font-size:var(--meta);color:var(--mut);line-height:1.5}
.note{font-size:var(--meta);color:var(--dim);line-height:1.55}
.micro{font-size:var(--micro);color:var(--dim);line-height:1.5}
b,strong{font-weight:750}
.hint{font-size:var(--meta);color:var(--dim)}

/* ------------------------------------------------------------------ the window shell */
.win{height:100%;display:flex;flex-direction:column;overflow:hidden}

.topbar{display:flex;align-items:center;gap:var(--sp-m);padding:var(--sp-m) var(--sp-l);background:var(--panel);
  border-bottom:var(--bw) solid var(--line);flex:none;min-height:56px}
.brandmark{width:30px;height:30px;flex:none;background:var(--brand);border:var(--bw) solid var(--line);
  display:grid;place-items:center;font-weight:800;font-size:var(--body);color:var(--on-brand)}
.wordmark{font-weight:800;font-size:var(--h3);text-transform:uppercase;letter-spacing:.6px}
.topbar .sp{flex:1}
.statusbar{display:flex;align-items:center;gap:var(--sp-s);flex-wrap:nowrap;overflow:hidden}

.main{flex:1;display:flex;min-height:0}

/* --- left sidebar, grouped (docs/design.md §4.1) --- */
.side{width:208px;flex:none;background:var(--raise);border-right:var(--bw) solid var(--line);
  padding:var(--sp-m) var(--sp-m);display:flex;flex-direction:column;gap:var(--sp-l);overflow-y:auto}
.grp{display:flex;flex-direction:column;gap:var(--sp-xs)}
.grp>.lbl{padding:var(--sp-xxs) var(--sp-s) var(--sp-xs)}
.nav{display:flex;align-items:center;gap:var(--sp-m);min-height:36px;padding:var(--sp-s) var(--sp-m);border:var(--bw) solid transparent;
  font-size:var(--body);font-weight:600;color:var(--mut);cursor:pointer;background:none;text-align:left;
  font-family:var(--f);width:100%}
.nav:hover{background:var(--raise2);border-color:var(--line)}
.nav.on{background:var(--brand);border-color:var(--line);color:var(--on-brand);font-weight:750;
  box-shadow:var(--sh-ctl)}
.nav .ic{width:18px;text-align:center;font-family:var(--fmono);font-size:var(--meta);font-weight:700}
.nav .cnt{margin-left:auto;font-family:var(--fmono);font-size:var(--micro);font-weight:700;
  border:var(--bw) solid var(--line);padding:0 var(--sp-xs);background:var(--panel);color:var(--ink)}
.nav.on .cnt{background:var(--panel);color:var(--ink)}
.side .grow{flex:1}

/* --- body --- */
.body{flex:1;padding:var(--sp-xl) var(--sp-xl) 40px;overflow-y:auto;overflow-x:hidden;min-width:0}
.wrapc{max-width:1180px;margin:0 auto}
.pagetop{display:flex;align-items:flex-start;gap:var(--sp-l);flex-wrap:wrap;margin-bottom:var(--sp-l)}
.pagetop .grow{flex:1;min-width:260px}
.sec{margin-top:var(--sp-xl)}
.sec:first-child{margin-top:0}
.g2>.sec,.g3>.sec,.stack>.sec{margin-top:0}
.sechead{display:flex;align-items:center;gap:var(--sp-m);margin-bottom:var(--sp-m);flex-wrap:wrap}
.sechead .lbl{flex:1}
.lead{display:flex;align-items:flex-start;gap:var(--sp-m);margin-bottom:var(--sp-l)}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:var(--gap)}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:var(--gap)}
.stack{display:flex;flex-direction:column;gap:var(--gap)}
.strip{display:flex;gap:var(--sp-s);flex-wrap:wrap;align-items:center}
.rowflex{display:flex;align-items:center;gap:var(--sp-m)}
.grow{flex:1;min-width:0}
.right{margin-left:auto}

/* ------------------------------------------------------------------ surfaces */
.card{background:var(--panel);border:var(--bw) solid var(--line);padding:var(--pad)}
.card.hero{box-shadow:var(--sh-hero)}
.flush{background:var(--panel);border:var(--bw) solid var(--line)}
.flush>*+*{border-top:3px solid var(--bg)}
.row{display:flex;align-items:center;gap:var(--sp-m);padding:var(--row-y) var(--pad);flex-wrap:wrap}
.row.tight{padding:var(--sp-s) var(--sp-m)}
.row .grow{flex:1;min-width:0}
.dark{background:var(--ink);color:var(--bg);border-color:var(--line)}
.dark .lbl{color:var(--bg);opacity:.7}
.tag{display:inline-flex;align-items:center;gap:var(--sp-s);height:26px;padding:0 var(--sp-s);border:var(--bw) solid var(--line);
  background:var(--raise);font-family:var(--fmono);font-size:var(--micro);font-weight:700;
  letter-spacing:.5px;text-transform:uppercase;color:var(--ink);white-space:nowrap}
.tag.brand{background:var(--brand);color:var(--on-brand)}
.tag.run{background:var(--run);color:var(--on-accent)}
.tag.ok{background:var(--ok);color:var(--on-brand)}
.tag.warn{background:var(--warn);color:var(--on-accent)}
.tag.bad{background:var(--bad);color:var(--on-bad)}
.tag.cal{background:var(--cal);color:var(--on-accent)}
.tag.ghost{background:transparent;color:var(--mut);border-color:var(--line)}
.tag.solid{background:var(--ink);color:var(--bg)}
.dot{width:11px;height:11px;border:var(--bw) solid var(--line);border-radius:50%;background:var(--dim);flex:none}
.dot.run{background:var(--run)}.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}
.dot.bad{background:var(--bad)}.dot.cal{background:var(--cal)}.dot.brand{background:var(--brand)}
.shape-sq{width:12px;height:12px;border:var(--bw) solid var(--line);background:var(--dim);flex:none}
/* Status is never colour alone (§8): these carry a glyph as well as a fill. */
.glyph{font-family:var(--fmono);font-weight:700;font-size:var(--meta);line-height:1}

/* ------------------------------------------------------------------ controls */
.btn{min-height:var(--ctl-h);padding:0 var(--sp-l);border:var(--bw) solid var(--line);background:var(--brand);
  color:var(--on-brand);font-family:var(--f);font-size:var(--body);font-weight:700;
  text-transform:uppercase;letter-spacing:.4px;display:inline-flex;align-items:center;justify-content:center;
  gap:var(--sp-s);cursor:pointer;box-shadow:var(--sh-ctl);transition:transform .06s linear}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;transform:none}
.btn.ghost{background:var(--panel);color:var(--ink)}
.btn.quiet{background:var(--raise);color:var(--ink)}
.btn.danger{background:var(--bad);color:var(--on-bad)}
.btn.warn{background:var(--warn);color:var(--on-accent)}
.btn.run{background:var(--run);color:var(--on-accent)}
.btn.ok{background:var(--ok);color:var(--on-brand)}
.btn.sm{min-height:30px;padding:0 var(--sp-m);font-size:var(--meta)}
.btn.wide{width:100%}
.btn[aria-busy="true"]{cursor:progress}
.btn[aria-busy="true"]::after{content:"…";font-family:var(--fmono)}
.btn.err{border-color:var(--bad)}
.linkbtn{background:none;border:none;padding:0;font:inherit;font-size:var(--meta);color:var(--link);
  text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-weight:650}
.linkbtn:hover{color:var(--ink)}
input,select,textarea{font-family:var(--f);font-size:var(--body);color:var(--ink);background:var(--raise);
  border:var(--bw) solid var(--line);min-height:var(--ctl-h);padding:0 var(--sp-m);width:100%;user-select:text}
input[type="checkbox"]{min-height:0;width:22px;height:22px;flex:none;accent-color:var(--brand);
  border:var(--bw) solid var(--line);cursor:pointer}
input[type="range"]{min-height:44px;padding:0;border:none;background:none;accent-color:var(--brand);cursor:pointer}
textarea{min-height:120px;padding:var(--sp-s) var(--sp-m);line-height:1.5;font-size:var(--meta)}
select{cursor:pointer;appearance:none;background-image:none;padding-right:var(--sp-xl);
  background:var(--panel)}
.field{display:flex;flex-direction:column;gap:var(--sp-xs)}
.field>.lbl{letter-spacing:1px}
.inline{display:flex;align-items:center;gap:var(--sp-m);flex-wrap:wrap}
.inline>label{display:flex;align-items:center;gap:var(--sp-s);font-size:var(--body);cursor:pointer}
.err-msg{font-size:var(--meta);color:var(--ink);font-weight:650;border-left:4px solid var(--bad);padding-left:var(--sp-s)}
.ok-msg{font-size:var(--meta);color:var(--ink);font-weight:650;border-left:4px solid var(--ok);padding-left:var(--sp-s)}
.warn-msg{font-size:var(--meta);color:var(--ink);font-weight:650;border-left:4px solid var(--warn);padding-left:var(--sp-s)}

/* Segmented choice — square, not pills. */
.seg{display:inline-flex;border:var(--bw) solid var(--line);background:var(--raise)}
.seg>button{min-height:32px;padding:0 var(--sp-m);border:none;border-right:var(--bw) solid var(--line);
  background:var(--panel);color:var(--mut);font-family:var(--f);font-size:var(--meta);font-weight:700;
  text-transform:uppercase;letter-spacing:.4px;cursor:pointer}
.seg>button:last-child{border-right:none}
.seg>button:hover{background:var(--raise2)}
.seg>button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand)}

/* Toggle switch: a square track with a square knob, because nothing here is a pill. */
.sw{display:inline-flex;align-items:center;gap:var(--sp-m);cursor:pointer;background:none;border:none;
  font:inherit;color:inherit;padding:0;text-align:left}
.sw .track{width:52px;height:28px;border:var(--bw) solid var(--line);background:var(--raise2);flex:none;
  position:relative}
.sw .knob{position:absolute;top:0;left:0;width:22px;height:100%;background:var(--line)}
.sw[aria-pressed="true"] .track{background:var(--ok)}
.sw[aria-pressed="true"] .knob{left:calc(100% - 22px)}

/* ------------------------------------------------------------------ the countdown ring */
.ring{flex:none}
.ring .trk{fill:none;stroke:var(--raise2);stroke-width:12}
.ring .arc{fill:none;stroke:var(--run);stroke-width:12;stroke-linecap:butt}
.ring .tick{stroke:var(--line);stroke-width:2}
.ring .ctr{font-family:var(--fmono);font-weight:800;font-size:var(--h2);fill:var(--ink)}
.ring .ctr-l{font-family:var(--fmono);font-size:var(--micro);font-weight:700;letter-spacing:1.2px;fill:var(--dim)}

/* ------------------------------------------------------------------ the dial (§6) */
.dialwrap{display:flex;flex-direction:column;align-items:center;gap:var(--sp-m)}
.dial{width:248px;height:248px;touch-action:none;cursor:crosshair}
.dial .track{fill:none;stroke:var(--line);stroke-width:1}
.dial .track-soft{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:2 4;opacity:.5}
.dial .night{fill:none;stroke:var(--raise2);stroke-width:12;stroke-linecap:butt}
.dial .arc{fill:none;stroke:var(--brand);stroke-width:9;stroke-linecap:butt}
.dial .arc-run{stroke:var(--run)}
.dial .evt{fill:none;stroke:var(--cal);stroke-width:3}
.dial .tick{stroke:var(--line);stroke-width:2}
.dial .tick-min{stroke:var(--line);stroke-width:1;opacity:.55}
/* Handles are circles with a hit area of at least 44px, even though the visible handle is smaller
   (§6.1, §8). The circle is painted with a 3px ink border at r=11 in CSS pixels of the viewBox. */
.dial .hit{fill:transparent;stroke:none;cursor:grab}
.dial .hdl{fill:none;stroke:transparent;stroke-width:22}
.dial .hdl-face{fill:var(--brand);stroke:var(--line);stroke-width:3;pointer-events:none}
.dial .hdl-dot{fill:var(--panel)}
.dial .ctr-val{font-family:var(--fmono);font-weight:800;font-size:var(--display);fill:var(--ink)}
.dial .ctr-lbl{font-family:var(--fmono);font-size:var(--micro);font-weight:700;letter-spacing:1.6px;fill:var(--dim)}
.dial .ctr-sub{font-family:var(--f);font-size:var(--micro);fill:var(--mut)}
.dialpresets{display:flex;gap:var(--sp-s);flex-wrap:wrap;justify-content:center}

/* ------------------------------------------------------------------ week at a glance (§5.3, §7) */
.weekgrid{display:grid;grid-template-columns:52px repeat(7,minmax(0,1fr));gap:var(--sp-s)}
.weekgrid .hcell{font-family:var(--fmono);font-size:var(--micro);font-weight:700;letter-spacing:1px;
  text-transform:uppercase;color:var(--dim);text-align:center;padding-bottom:var(--sp-xxs)}
.weekgrid .gutter{position:relative;height:288px}
.weekgrid .glabel{position:absolute;right:4px;font-family:var(--fmono);font-size:var(--micro);
  color:var(--dim);transform:translateY(-50%)}
/* The one rule that keeps the chart from eating the page: every day column clips its own bands, so a
   mis-signed span can never paint over the controls below the chart (docs/design.md §7.4–§7.6). */
.daycol{position:relative;height:288px;overflow:hidden;border:var(--bw) solid var(--line);
  background:var(--raise)}
.daycol .hourline{position:absolute;left:0;right:0;height:1px;background:var(--panel)}
.band{position:absolute;left:2px;right:2px;overflow:hidden;border:var(--bw) solid var(--line);
  background:var(--brand-t);padding:1px var(--sp-xs);font-family:var(--fmono);font-size:var(--micro);font-weight:700;
  color:var(--ink);cursor:pointer;white-space:nowrap;text-overflow:ellipsis}
.band.cal{background:var(--cal-t)}
.band.paused{background:var(--raise2);color:var(--dim);border-style:dashed}
.band.faded{opacity:.45}
.daycol .nowline{position:absolute;left:0;right:0;height:3px;background:var(--run);z-index:3}
.daycol .nowline::before{content:"";position:absolute;left:-3px;top:-3px;width:9px;height:9px;
  background:var(--run);border:var(--bw) solid var(--line);border-radius:50%}
.weeklegend{display:flex;gap:var(--sp-l);flex-wrap:wrap;margin-top:var(--sp-m)}

/* ------------------------------------------------------------------ timeline + scrubber */
.timeline{position:relative;height:58px;border:var(--bw) solid var(--line);background:var(--raise);overflow:hidden}
.timeline .tl-label{position:absolute;top:2px;font-family:var(--fmono);font-size:var(--micro);color:var(--dim);
  transform:translateX(-50%)}
.timeline .tl-band{position:absolute;top:20px;height:26px;border:var(--bw) solid var(--line);background:var(--brand-t)}
.timeline .tl-band.run{background:var(--run-t)}
.timeline .tl-band.cal{background:var(--cal-t)}
.timeline .tl-now{position:absolute;top:0;bottom:0;width:3px;background:var(--run)}
.scrubber{margin-top:var(--sp-m)}
.scrub-row{display:flex;align-items:center;gap:var(--sp-m)}
.scrub-val{font-family:var(--fmono);font-size:var(--meta);font-weight:700;min-width:96px}

/* ------------------------------------------------------------------ bars + heatmap */
.bars{display:flex;align-items:flex-end;gap:var(--sp-xs);height:140px}
.bars .barcol{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:var(--sp-xs)}
.bars .bar{width:100%;max-width:30px;background:var(--run);border:var(--bw) solid var(--line)}
.bars .bar.empty{background:var(--raise2)}
.heat{display:grid;grid-template-columns:repeat(24,minmax(0,1fr));gap:var(--sp-xxs)}
.heat .cell{aspect-ratio:1;border:var(--bw) solid var(--line);background:var(--raise)}
.heat .cell.on{background:var(--run)}
.heat .cell.mid{background:var(--warn)}
.heat .cell.low{background:var(--brand-t)}
.heatrow{display:flex;align-items:center;gap:var(--sp-s)}
.leader .row{justify-content:space-between}

/* ------------------------------------------------------------------ meters */
.meter{height:20px;border:var(--bw) solid var(--line);background:var(--raise);position:relative;overflow:hidden}
.meter>span{display:block;height:100%;background:var(--brand)}
.meter.run>span{background:var(--run)}
.meter .mtext{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--fmono);font-size:var(--micro);font-weight:700;color:var(--ink)}

/* ------------------------------------------------------------------ sheets, toasts, palette (§4.1, §8) */
.scrim{position:fixed;inset:0;background:var(--scrim);display:grid;place-items:center;padding:var(--sp-xl);
  z-index:60}
.sheet{width:min(660px,94vw);max-height:88vh;overflow-y:auto;background:var(--panel);
  border:var(--bw) solid var(--line);box-shadow:var(--sh-hero);padding:var(--sp-xl)}
.sheet h2{font-size:var(--h2)}
.sheethead{display:flex;align-items:flex-start;gap:var(--sp-m);margin-bottom:var(--sp-l)}
.sheetfoot{display:flex;gap:var(--sp-m);justify-content:flex-end;flex-wrap:wrap;margin-top:var(--sp-l);
  padding-top:var(--sp-l);border-top:var(--bw) solid var(--line)}
.scrim[data-wide] .sheet{width:min(920px,96vw)}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;display:flex;
  flex-direction:column;gap:var(--sp-s);z-index:80;width:min(560px,92vw);pointer-events:none}
.toast{pointer-events:auto;border:var(--bw) solid var(--line);background:var(--panel);padding:var(--sp-m) var(--sp-m);
  box-shadow:var(--sh-hero);display:flex;gap:var(--sp-m);align-items:flex-start}
.toast .grow{flex:1;min-width:0}
.toast.ok{border-left:10px solid var(--ok)}
.toast.warn{border-left:10px solid var(--warn)}
.toast.bad{border-left:10px solid var(--bad)}
.toast.info{border-left:10px solid var(--brand)}
.palette .pl-input{font-size:var(--h3);min-height:52px;font-weight:650}
.pl-list{max-height:52vh;overflow-y:auto;border:var(--bw) solid var(--line);margin-top:var(--sp-m)}
.pl-item{display:flex;align-items:center;gap:var(--sp-m);padding:var(--sp-m) var(--sp-m);cursor:pointer;background:var(--panel);
  border-bottom:3px solid var(--bg);width:100%;text-align:left;font:inherit;color:var(--ink);border-left:none;border-right:none;border-top:none}
.pl-item:last-child{border-bottom:none}
.pl-item:hover{background:var(--raise)}
.pl-item[aria-selected="true"]{background:var(--brand);color:var(--on-brand)}
.pl-item[aria-selected="true"] .meta{color:var(--on-brand);opacity:.85}
.pl-kbd{font-family:var(--fmono);font-size:var(--micro);border:var(--bw) solid var(--line);padding:1px var(--sp-xs);
  background:var(--raise);color:var(--ink)}
.pl-group{font-family:var(--fmono);font-size:var(--micro);font-weight:700;letter-spacing:1.2px;
  text-transform:uppercase;color:var(--dim);padding:var(--sp-s) var(--sp-m) var(--sp-xs);background:var(--raise)}

/* ------------------------------------------------------------------ receipt (dial §6.4) */
.receipt{border:var(--bw) solid var(--line);background:var(--panel);box-shadow:var(--sh-ctl)}
.receipt .rrow{display:flex;gap:var(--sp-m);justify-content:space-between;padding:var(--sp-s) var(--sp-m);
  border-bottom:3px solid var(--bg)}
.receipt .rrow:last-child{border-bottom:none}
.receipt .rk{font-family:var(--fmono);font-size:var(--micro);letter-spacing:1.2px;text-transform:uppercase;color:var(--dim)}
.receipt .rv{font-family:var(--fmono);font-weight:700;text-align:right}

/* ------------------------------------------------------------------ empty / state blocks */
.empty{border:var(--bw) dashed var(--line);background:var(--panel);padding:var(--sp-xl) var(--sp-xl);text-align:center}
.empty .display{margin:var(--sp-s) 0 var(--sp-s)}
.skel{background:var(--raise);border:var(--bw) solid var(--line);height:16px;margin:var(--sp-s) 0}
.skel.w60{width:60%}.skel.w40{width:40%}.skel.w80{width:80%}
.alert{border:var(--bw) solid var(--line);border-left:12px solid var(--warn);background:var(--panel);padding:var(--pad)}
.alert.bad{border-left-color:var(--bad)}
.alert.ok{border-left-color:var(--ok)}
.alert.info{border-left-color:var(--brand)}
.alert.cal{border-left-color:var(--cal)}
.kv{display:grid;grid-template-columns:minmax(120px,auto) 1fr;gap:var(--sp-s) var(--sp-l)}
.kv dt{font-family:var(--fmono);font-size:var(--micro);letter-spacing:1.1px;text-transform:uppercase;color:var(--dim)}
.kv dd{font-size:var(--meta);color:var(--ink);overflow-wrap:anywhere}
pre.doc{font-family:var(--fmono);font-size:var(--meta);line-height:1.5;background:var(--raise);
  border:var(--bw) solid var(--line);padding:var(--sp-m);overflow:auto;max-height:340px;user-select:text}
.diff{font-family:var(--fmono);font-size:var(--meta);line-height:1.6}
.diff .add{background:var(--ok-t)}
.diff .del{background:var(--bad-t);text-decoration:line-through}
.diff .same{color:var(--dim)}
.daypick{display:flex;gap:var(--sp-xs);flex-wrap:wrap}
.daypick button{width:44px;min-height:38px}
.qr{border:var(--bw) solid var(--line);background:var(--panel);padding:var(--sp-m);display:grid;
  grid-template-columns:repeat(8,1fr);gap:var(--sp-xxs);width:190px}
.qr i{aspect-ratio:1;background:var(--line)}
.code6{font-family:var(--fmono);font-size:var(--display);font-weight:800;letter-spacing:5px;user-select:text}
.taplist{display:flex;flex-direction:column;gap:var(--sp-s)}
.step{border:var(--bw) solid var(--line);background:var(--raise);padding:var(--sp-s) var(--sp-m);font-size:var(--meta)}
.step.on{background:var(--brand-t);font-weight:700}
.step .n{font-family:var(--fmono);font-weight:800;margin-right:var(--sp-s)}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);
  white-space:nowrap;border:0}
.scrollx{overflow-x:auto}
.chip-list{display:flex;flex-wrap:wrap;gap:var(--sp-s)}
.mono.strong{font-weight:700}
hr.rule{border:none;border-top:3px solid var(--bg);margin:var(--sp-xl) 0}
</style>
</head>
<body>
<div class="win">
  <header class="topbar">
    <div class="brandmark" aria-hidden="true">C</div>
    <div class="wordmark">Curfew</div>
    <div class="grow"></div>
    <div class="statusbar" id="statusbar"></div>
    <button class="btn quiet sm" id="palette-open" data-cmdk="1" title="Command palette (Ctrl+K)">
      <span class="mono">Ctrl+K</span> Commands
    </button>
  </header>
  <div class="main">
    <nav class="side" aria-label="Sections">
      <button class="nav" data-page="now"><span class="ic" aria-hidden="true">&#9679;</span>Now<span class="cnt" id="nav-now"></span></button>
      <button class="nav" data-page="start"><span class="ic" aria-hidden="true">&#9654;</span>Start</button>
      <button class="nav" data-page="plan"><span class="ic" aria-hidden="true">&#9638;</span>Plan<span class="cnt" id="nav-plan"></span></button>
      <button class="nav" data-page="devices"><span class="ic" aria-hidden="true">&#9787;</span>Devices</button>
      <button class="nav" data-page="settings"><span class="ic" aria-hidden="true">&#9881;</span>Settings</button>
      <div class="grow"></div>
      <div class="note" style="padding:var(--sp-s)">Closing this window stops nothing.</div>
    </nav>
    <main class="body" id="body" tabindex="-1"></main>
  </div>
</div>
<div id="modal"></div>
<div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>
<!-- One throttled announcement a minute, never one a second (§8). -->
<div class="sr" id="live" role="status" aria-live="polite" aria-atomic="true"></div>
<noscript><div class="card" style="margin:var(--sp-xl)">Curfew's window needs scripting to show what is
  blocked. The service is still blocking; only this window is blank.</div></noscript>
<script>
"use strict";
/* ==================================================================================================
   1. The bridge.

   One promise per call, settled by the host through `__curfewReply`. Nothing here reaches the
   network: this page has no origin and loads nothing. The message kinds are the whole closed set
   `crates/curfew-app/src/app.rs` accepts — `ipc`, `config`, `save_config_json`, `save_config`,
   `unlock`, `installed_apps`, `pairing_server` — and no other.
   ================================================================================================== */
let nextId = 1;
const pending = new Map();
/* A service that accepts the connection and never replies would otherwise leave the promise, and the
   status loop's `busy` guard with it, pending forever. `unlock` is exempt: it waits on a person at the
   system prompt. A reply that arrives after the deadline is dropped. */
const CALL_DEADLINE_MS = 15000;
const LATE_DETAIL = "The Curfew service did not answer in time. A change you asked for may still "
  + "take effect; this window will keep checking.";
function call(message) {
  return new Promise((resolve) => {
    const id = nextId++;
    pending.set(id, resolve);
    if (message.kind !== "unlock") {
      setTimeout(() => {
        if (!pending.delete(id)) return;
        resolve({ ok: false, detail: LATE_DETAIL });
      }, CALL_DEADLINE_MS);
    }
    window.ipc.postMessage(JSON.stringify(Object.assign({ id }, message)));
  });
}
window.__curfewReply = function (id, json) {
  const resolve = pending.get(id);
  if (!resolve) return;
  pending.delete(id);
  resolve(JSON.parse(json));
};
const askService = (payload) => call({ kind: "ipc", payload });
const readConfig = () => call({ kind: "config" });
const readApps = () => call({ kind: "installed_apps" });
const pairingServer = () => call({ kind: "pairing_server" });
/* Ends a block by proving ownership of the machine. No password crosses this bridge — the host
   shows the system prompt and talks to the service itself. */
const askUnlock = (id) => call({ kind: "unlock", id });

const IN_FLIGHT_DETAIL = "The Curfew service is not answering. Nothing has been changed; this "
  + "window will keep trying.";

/* ==================================================================================================
   2. Words and numbers.
   ================================================================================================== */
const esc = (s) => String(s == null ? "" : s)
  .replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad2 = (n) => String(n).padStart(2, "0");
/** Seconds as `9:05` or `1:04:30` — the clock the countdown reads as. */
function clock(seconds) {
  seconds = Math.max(0, Math.round(seconds));
  const h = Math.floor(seconds / 3600), m = Math.floor((seconds % 3600) / 60), s = seconds % 60;
  return h > 0 ? `${h}:${pad2(m)}:${pad2(s)}` : `${m}:${pad2(s)}`;
}
/** Minutes as `45m`, `2h 30m`. The spelling the phone uses too. */
function spellMinutes(m) {
  m = Math.max(0, Math.round(m));
  if (m < 60) return `${m}m`;
  const h = Math.floor(m / 60), r = m % 60;
  return r === 0 ? `${h}h` : `${h}h ${r}m`;
}
/** Minutes as a wall clock: `18:00`. */
function hhmm(minute) {
  const m = ((Math.round(minute) % 1440) + 1440) % 1440;
  return `${pad2(Math.floor(m / 60))}:${pad2(m % 60)}`;
}
function atTime(unix) {
  if (unix == null) return "—";
  return new Date(unix * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
}
function atDateTime(unix) {
  if (unix == null) return "—";
  return new Date(unix * 1000).toLocaleString([], { weekday: "short", hour: "2-digit", minute: "2-digit" });
}
const DAYS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
const DAYS_LONG = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
/** Index 0 = Monday, which is how the plan file stores days. */
function todayIndex() { return (new Date().getDay() + 6) % 7; }
function describeDays(days) {
  if (!days || days.length === 0) return "Every day";
  const sorted = [...days].map(Number).sort((a, b) => a - b);
  const key = sorted.join(",");
  if (key === "0,1,2,3,4") return "Weekdays";
  if (key === "5,6") return "Weekends";
  if (sorted.length === 7) return "Every day";
  return sorted.map((d) => DAYS[d] || "?").join(", ");
}

/* ------------------------------------------------------------------ the plan's numbers (§7) */
/* Daily times live in 0..1439 and are NEVER reduced modulo 10080 (§7.1). A rule that crosses
   midnight is the one case where arithmetic wraps, and it wraps by a day, not by a week. */
function clampDaily(value, fallback) {
  const n = Number(value);
  if (!isFinite(n)) return fallback;
  return Math.min(1439, Math.max(0, Math.round(n)));
}
/** Whether a window crosses midnight: an explicit `wrap` boolean, or plainly `end < start` (§7.3). */
function ruleWrap(rule) {
  if (!rule) return false;
  const start = rule.start_minute != null ? rule.start_minute : rule.start;
  const end = rule.end_minute != null ? rule.end_minute : rule.end;
  if (start == null || end == null) return false;
  return Number(end) < Number(start);
}
/** How long a daily window lasts (§7.2). Same day: `end - start`. Overnight:
    `(end - start + 1440) % 1440`. */
function spanOf(start, end, wrap) {
  start = clampDaily(start, 0);
  end = clampDaily(end, 0);
  if (wrap || end < start) return ((end - start + 1440) % 1440) || 1440;
  return end - start;
}
/** One human sentence for a window: `Every day · 22:45 -> 06:30, into next morning · 7h 45m`. */
function windowSentence(rule) {
  const wrap = ruleWrap(rule);
  const span = spanOf(rule.start_minute, rule.end_minute, wrap);
  return `${describeDays(rule.days)} \u00b7 ${hhmm(rule.start_minute)} \u2192 ${hhmm(rule.end_minute)}`
    + (wrap ? ", into next morning" : "")
    + ` \u00b7 ${spellMinutes(span)}`;
}

/* ------------------------------------------------------------------ locks and strengths */
/** The one strength a set of conditions adds up to, in the three words of §5.2. */
function strengthKeyOf(locks) {
  const kinds = (locks || []).map(lockKind);
  if (kinds.includes("timer") || kinds.includes("device_credential")) return "lock";
  if (kinds.includes("confirm")) return "wait";
  return "ask";
}
/** "Mon 3" — enough to find a day in a fortnight without reading a date twice. */
function dayLabel(date) {
  const parsed = new Date(String(date) + "T12:00:00");
  if (isNaN(parsed)) return String(date);
  return parsed.toLocaleDateString(undefined, { weekday: "short", day: "numeric" });
}
/** A lock's *kind*, which is what decisions are made on — never the wording of a label. */
function lockKind(lock) {
  return typeof lock === "string" ? lock : (lock && lock.kind) || "";
}
/** The promise, said the way the user chose it rather than the way it is stored. */
function describeLock(lock) {
  switch (lockKind(lock)) {
    case "timer": return "runs to its own end";
    case "confirm": return "asks you first";
    case "device_credential": return "your Windows password";
    case "challenge": return "a challenge";
    case "peer_release": return "another paired device";
    case "token": return "a tag kept somewhere else";
    case "restart_required": return "a restart";
    default:
      console.warn("unknown lock kind", lock);
      return "a condition this version of Curfew does not know about";
  }
}
/* The three strengths of §5.2, each stating its consequence in one sentence. This is the ONLY list
   in the page that names a lock's wire kind, because the host scrapes it (`lock_kinds_referenced`),
   and every entry must be a lock the core actually understands. */
const STRENGTHS = [
  { id: "ask", label: "Just ask me",
    note: "Ends immediately — pressing end is all it takes.",
    what: "The end button ends it the moment you press it.",
    lock: null },
  { id: "wait", label: "Make me wait",
    note: "A five-minute hold before it ends, so it is never an accident.",
    what: "Ending it early starts a five-minute wait you have to sit through.",
    lock: { kind: "confirm" } },
  { id: "lock", label: "Lock it",
    note: "Your Windows credential is required to end it early. Curfew never asks for it itself.",
    what: "Only your Windows password can end it early, through the system prompt.",
    lock: { kind: "device_credential" } },
  { id: "run", label: "Lock it for the whole time",
    note: "Nothing ends it early. The 24-hour release is the way out.",
    what: "Runs to its own end; the last-resort release is the only way out.",
    lock: { kind: "timer" } },
];
const strengthById = (id) => STRENGTHS.find((s) => s.id === id) || STRENGTHS[0];
/** A rule's locks expressed as one of the strength ids, so the editor round-trips them. */
function strengthIdFromLocks(locks) {
  const kinds = (locks || []).map(lockKind);
  if (kinds.includes("timer")) return "run";
  if (kinds.includes("device_credential")) return "lock";
  if (kinds.includes("confirm")) return "wait";
  return "ask";
}

/* ------------------------------------------------------------------ targets */
function describeTarget(target) {
  if (!target) return { text: "(no target)", group: "apps", kind: "" };
  const t = target.kind;
  switch (t) {
    case "windows_exe": return { text: target.exe, group: "apps", kind: t };
    case "app_package": return { text: target.package, group: "apps", kind: t };
    case "app_screen": return { text: `${target.package} · ${target.screen}`, group: "apps", kind: t };
    case "domain": return { text: target.domain, group: "sites", kind: t };
    case "url": return { text: target.pattern, group: "sites", kind: t };
    case "keyword": return { text: `anything saying "${target.text}"`, group: "sites", kind: t };
    case "window_title": return { text: `windows titled ${target.pattern}`, group: "apps", kind: t };
    case "file_path": return { text: target.pattern, group: "apps", kind: t };
    case "notification_source": return { text: `notifications from ${target.package}`, group: "apps", kind: t };
    case "whole_device": return { text: "the whole machine", group: "apps", kind: t };
    default: return { text: JSON.stringify(target), group: "apps", kind: t || "" };
  }
}
/** What a rule's action means, in the vocabulary of §9. */
function describeAction(action) {
  if (!action) return "Blocked";
  const kind = action.kind;
  if (kind === "block") return "Blocked";
  if (kind === "allow_only") return "Only this is allowed";
  if (kind === "budget") return `Allowance ${spellMinutes(action.seconds / 60)} a day`;
  if (kind === "launch_limit") return `${action.count} openings a day`;
  if (kind === "delay") return `A ${action.seconds}-second wait first`;
  if (kind === "mute_notifications") return "Notifications silenced";
  return kind;
}
function actionShort(action) {
  if (!action) return "block";
  if (action.kind === "budget") return "allowance";
  if (action.kind === "delay") return "wait";
  if (action.kind === "launch_limit") return "limit";
  if (action.kind === "mute_notifications") return "silence";
  if (action.kind === "allow_only") return "only";
  return "block";
}

/* ------------------------------------------------------------------ refusals, in sentences */
/* A raw `{"refusal":"quota_spent","next_at":…}` is not a sentence a person can act on, so every
   refusal is composed here instead of being printed as JSON. */
function describeRefusal(refusal) {
  if (!refusal) return "The service refused, without saying why.";
  switch (refusal.refusal) {
    case "not_running": return "That block is not running any more.";
    case "locked":
      return "Not yet: this block is held by " + ((refusal.missing || []).map(describeLock).join(" and ")
        || "a condition this version does not know about") + ".";
    default: return "The service refused: " + describeUnknown(refusal);
  }
}
function describePassRefusal(refusal) {
  if (!refusal) return "No pass is available right now.";
  switch (refusal.refusal) {
    case "disabled": return "Emergency passes are switched off in the plan file.";
    case "quota_spent": return "This window's passes are spent. The next one is back at " + atDateTime(refusal.next_at) + ".";
    case "cooling_down": return "A pass was spent recently. The next is available at " + atDateTime(refusal.until) + ".";
    default: return "No pass is available: " + describeUnknown(refusal);
  }
}
/** Anything from a newer service, said as facts rather than as JSON. */
function describeUnknown(value) {
  try {
    const pairs = Object.entries(value || {}).map(([k, v]) =>
      `${k.replace(/_/g, " ")} = ${typeof v === "number" && v > 1e9 ? atDateTime(v) : v}`);
    return pairs.length ? pairs.join(", ") : "no detail";
  } catch (e) { return "no detail"; }
}
function describeSource(source) {
  if (!source) return "started by hand";
  if (source.kind === "manual") return "you started it by hand";
  if (source.kind === "weekly") return `the weekly rule "${source.schedule}" started it`;
  if (source.kind === "calendar") return `the calendar event "${source.event}" started it`;
  return "started by hand";
}
function describeMatcher(matcher) {
  if (!matcher) return "Every event";
  const parts = [];
  if (matcher.title) parts.push(`titled ${matcher.title}`);
  if (matcher.calendar) parts.push(`in ${matcher.calendar}`);
  if (matcher.location) parts.push(`at ${matcher.location}`);
  if (matcher.busy_only) parts.push("marked busy");
  if (matcher.categories && matcher.categories.length) parts.push(`in ${matcher.categories.join(", ")}`);
  if (matcher.all_day === true) parts.push("all-day events");
  if (matcher.all_day === false) parts.push("timed events");
  return parts.length ? "Events " + parts.join(", ") : "Every event";
}

/* ==================================================================================================
   Part 2 — state, polling, and the shared drawing helpers.
   ================================================================================================== */
const state = {
  page: "now",
  status: null,
  trouble: null,
  troubleDetail: null,
  config: null,
  configToml: null,
  configPath: null,
  configError: null,
  stats: null,
  apps: null,
  appsError: null,
  pairing: null,
  start: null,
  editor: null,
  scrub: 0,
  profile: null,
  profileTab: "apps",
  appQuery: "",
  appCat: "all",
  calendarQuery: "",
  planfile: { view: "toml", text: null, importText: "", importError: null, importOk: null, conflict: null, baseline: null },
  settings: null,
  palette: null,
  toasts: [],
  lastAnnouncedMinute: null,
};
const DEFAULT_SETTINGS = {
  theme: "light", scale: "100",
  contrast: "normal", motion: "ok",
};
const SETTINGS_KEY = "curfew.window.settings.v1";
function loadSettings() {
  let stored = {};
  try { stored = JSON.parse(window.localStorage.getItem(SETTINGS_KEY) || "{}") || {}; }
  catch (e) { stored = {}; }
  return Object.assign({}, DEFAULT_SETTINGS, stored);
}
function saveSettings() {
  try { window.localStorage.setItem(SETTINGS_KEY, JSON.stringify(state.settings)); }
  catch (e) { /* a window that cannot persist a preference still works for this session */ }
}
function applySettings() {
  const s = state.settings, root = document.documentElement;
  root.setAttribute("data-theme", s.theme);
  root.setAttribute("data-scale", s.scale);
  root.setAttribute("data-contrast", s.contrast);
  root.setAttribute("data-motion", s.motion);
}
state.settings = loadSettings();
applySettings();

/* ------------------------------------------------------------------ polling
   Bounded and honest: two seconds for the moment, a slower cadence for the two things that cost
   more (the plan file and a fortnight of history), and nothing overlapping — one loop, one ticket,
   and only the newest run is allowed to write. */
const STATUS_EVERY_MS = 2000;
const CONFIG_EVERY_TICKS = 15;
let refreshTicket = 0;
let ticks = 0;
let busy = false;

async function refresh(options) {
  const opts = options || {};
  const mine = ++refreshTicket;
  const answer = await askService({ request: "status" });
  if (mine !== refreshTicket) return;
  if (answer.ok && answer.value && answer.value.response === "status") {
    state.status = answer.value;
    state.trouble = null;
    state.troubleDetail = null;
  } else {
    state.status = null;
    state.trouble = answer.ok ? "error" : (answer.kind || "error");
    state.troubleDetail = answer.ok
      ? "The service answered something other than a status."
      : (answer.detail || IN_FLIGHT_DETAIL);
  }

  ticks += 1;
  if (ticks >= CONFIG_EVERY_TICKS || opts.force) {
    ticks = 0;
    const config = await readConfig();
    if (mine !== refreshTicket) return;
    if (config.ok) {
      state.config = config.value;
      state.configToml = config.toml || null;
      state.configError = null;
    } else {
      state.config = null;
      state.configError = config.detail || "The plan file could not be read.";
      state.configToml = config.toml || state.configToml;
    }
    state.configPath = config.path || state.configPath;
    const figures = await askService({ request: "stats", days: 14 });
    if (mine !== refreshTicket) return;
    if (figures.ok && figures.value && figures.value.response === "stats") state.stats = figures.value;
  }

  draw();
}
/** Re-read the plan at the next paint, for the callers that know it may have moved under them. */
function refreshConfigSoon() { ticks = CONFIG_EVERY_TICKS; }

async function loop() {
  if (busy) return;
  busy = true;
  try { await refresh(); } finally { busy = false; }
}
loop();
setInterval(loop, STATUS_EVERY_MS);

/** The service could not be reached. This is the one failure a person can act on, so it is a card
    with the host's own sentence and a retry, not a blank page. */
function troubleCard() {
  if (!state.trouble) return "";
  const t = state.trouble;
  const notAnswering = (state.troubleDetail || "").indexOf("not answering") >= 0;
  let title, body;
  if (t === "not_found") {
    title = "Curfew is not installed on this PC";
    body = "Nothing is being blocked, and nothing can be shown until the service is there.\n\n"
      + "Open Windows Terminal or PowerShell as an administrator and run:\n\tcurfew install";
  } else if (t === "denied") {
    title = "Windows refused this window access to the service";
    body = "That usually means the installed service is older than this window. Reinstalling it from an "
      + "administrator terminal replaces it with a matching one:\n\tcurfew install\n\n"
      + "Blocks are still being enforced while this is true — this window just cannot see them.";
  } else if (notAnswering) {
    title = "The service is not answering";
    body = state.troubleDetail;

    <div class="sub">${esc(waiting ? "Waiting for the Curfew service to answer." : "Nothing can be shown until the service answers.")}</div>

function profileName(id) {

function profiles() { return (state.config && state.config.profiles) || []; }

function calendarSources() { return (state.config && state.config.calendar_sources) || []; }

/* ------------------------------------------------------------------ toasts (§4.1) */
let toastSeq = 0;
function toast(title, body, tone) {
  const id = ++toastSeq;
  state.toasts = state.toasts.concat([{ id, title, body, tone: tone || "info" }]).slice(-3);
  paintToasts();
  setTimeout(() => { state.toasts = state.toasts.filter((x) => x.id !== id); paintToasts(); }, 9000);
}
function paintToasts() {
  const host = document.getElementById("toasts");
  if (!host) return;
  host.innerHTML = state.toasts.map((t) => `<div class="toast ${t.tone}">
    <div class="grow"><div class="h3">${esc(t.title)}</div>
      ${t.body ? `<div class="meta" style="margin-top:var(--sp-xs)">${esc(t.body)}</div>` : ""}</div>
    <button class="btn quiet sm" data-act="toast-close" data-id="${t.id}">Dismiss</button>
  </div>`).join("");
}

/* ------------------------------------------------------------------ the sheet (§5.4, §8) */
let focusBeforeSheet = null;
let sheetTitleSeq = 0;
/**
 * Put something over the page, or take it away.
 *
 * `role="dialog"`, `aria-modal`, a heading the dialog is labelled by, a real focus trap and a focus
 * restore. Without the trap the next Tab walks into the page *underneath*, so the visible dialog is
 * not the one being typed into; without the restore, closing a sheet drops the user back at the top
 * of the document.
 */
function sheet(html, options) {
  const opts = options || {};
  const modal = document.getElementById("modal");
  if (!html) {
    if (modal.querySelector("[data-sheet-role]")) state.editor = null;
    modal.innerHTML = "";
    if (focusBeforeSheet && document.contains(focusBeforeSheet)) {
      try { focusBeforeSheet.focus(); } catch (e) { /* the control may be gone after a redraw */ }
    }
    focusBeforeSheet = null;
    return;
  }
  if (!modal.innerHTML) focusBeforeSheet = document.activeElement;
  modal.innerHTML = "";
  const titleId = `sheet-title-${++sheetTitleSeq}`;
  /* Whichever heading the dialog has, it is the one that names it: the visible `h2` when there is
     one, and a hidden one otherwise, so `aria-labelledby` never points at nothing. */
  const dialogName = opts.title ? String(opts.title).replace(/<[^>]*>/g, "") : "Dialog";
  const head = opts.title
    ? `<div class="sheethead"><div class="grow"><h2>${opts.title}</h2>${opts.lead
        ? `<div class="sub" style="margin-top:var(--sp-s)">${opts.lead}</div>` : ""}</div>
        ${opts.headRight || ""}</div>`
    : "";
  modal.innerHTML = `<div class="scrim" data-scrim="1"${opts.wide ? ' data-wide="1"' : ""}${opts.role ? ` data-sheet-role="${esc(opts.role)}"` : ""}><div class="sheet" role="dialog" aria-modal="true"><h2 id="${titleId}" class="sr">${esc(dialogName)}</h2>${head}${html}</div></div>`;
  makeInteractive(modal);
  const first = modal.querySelector("[data-autofocus]")
    || modal.querySelector("input, textarea, select, .btn, [data-act]");
  setTimeout(() => { try { if (first) first.focus(); } catch (e) { /* nothing focusable */ } }, 0);
}
/** The sheet's own markup, for the many sheets that are one sentence and one button. */
function say(title, text, actLabel, act) {
  sheet(`<div class="wrap" style="line-height:1.6;color:var(--mut);white-space:pre-wrap">${esc(text)}</div>
    <div class="sheetfoot">${act
      ? `<button class="btn" data-act="${esc(act)}">${esc(actLabel)}</button>` : ""}
      <button class="btn ghost" data-act="close">Close</button></div>`, { title });
}
/** Confirmation with an explicit consequence, never a bare "Are you sure?". */
function confirmSheet(title, lead, confirmLabel, act, cancelLabel, tone) {
  sheet(`<div class="wrap" style="line-height:1.6;color:var(--mut)">${lead}</div>
    <div class="sheetfoot"><button class="btn ghost" data-act="close">${esc(cancelLabel || "Cancel")}</button>
    <button class="btn ${tone || ""}" data-act="${esc(act)}">${esc(confirmLabel)}</button></div>`, { title });
}
/** The keyboard trap: Tab and Shift+Tab cycle inside the sheet and nowhere else. */
function trapTab(event) {
  const sheetEl = document.querySelector("#modal .sheet");
  if (!sheetEl) return false;
  const focusables = [...sheetEl.querySelectorAll(
    'button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])')]
    .filter((el) => !el.disabled && el.offsetParent !== null);
  if (focusables.length === 0) { event.preventDefault(); return true; }
  const first = focusables[0], last = focusables[focusables.length - 1];
  if (event.shiftKey && (document.activeElement === first || !sheetEl.contains(document.activeElement))) {
    event.preventDefault(); last.focus();
  } else if (!event.shiftKey && document.activeElement === last) {
    event.preventDefault(); first.focus();
  }
  return true;
}

  { group: "Go", label: "Devices", hint: "Pairing and revoke", page: "devices" },
  { group: "Go", label: "Is Curfew working", hint: "Every enforcement layer", page: "health" },

  { group: "Do", label: "Replay the onboarding", hint: "The three questions from the beginning", act: "replay-onboarding" },
];
function openPalette() {
  state.palette = { q: "", index: 0 };
  renderPalette();
}
function paletteMatches() {
  const q = (state.palette ? state.palette.q : "").trim().toLowerCase();
  if (!q) return COMMANDS;
  return COMMANDS.filter((c) => (c.label + " " + c.hint + " " + c.group).toLowerCase().includes(q));
}
function renderPalette() {
  const matches = paletteMatches();
  const index = Math.min(state.palette.index, Math.max(0, matches.length - 1));
  state.palette.index = index;
  let lastGroup = null;
  const items = matches.map((c, i) => {
    const head = c.group !== lastGroup ? `<div class="pl-group">${esc(c.group)}</div>` : "";
    lastGroup = c.group;
    return head + `<button class="pl-item" role="option" data-pl="${i}" id="pl-${i}"
      aria-selected="${i === index ? "true" : "false"}">
      <span class="grow"><span class="h3" style="text-transform:none">${esc(c.label)}</span>
        <span class="meta" style="display:block">${esc(c.hint)}</span></span>
      ${i === index ? '<span class="pl-kbd">Enter</span>' : ""}</button>`;
  }).join("");
  sheet(`<input class="pl-input" id="pl-input" data-autofocus type="search" value="${esc(state.palette.q)}"
      placeholder="Jump to a screen, or run an action" aria-label="Search commands"
      aria-controls="pl-list" aria-activedescendant="${matches.length ? "pl-" + index : ""}" autocomplete="off">
    <div class="pl-list" id="pl-list" role="listbox" aria-label="Commands">
      ${items || '<div class="pl-item"><span class="meta">Nothing matches that.</span></div>'}
    </div>`, { title: "Commands", wide: true });
  const input = document.getElementById("pl-input");
  if (input) { input.focus(); input.setSelectionRange(input.value.length, input.value.length); }
}
function runPalette(index) {
  const chosen = paletteMatches()[index];
  if (!chosen) return;
  const act = chosen.act, page = chosen.page;
  sheet("");
  if (page) return go(page);
  if (act) return activate(synthetic(act));
}
/** A stand-in target, so palette entries and buttons take exactly the same code path. */
function synthetic(act, id) {
  const el = document.createElement("span");
  el.setAttribute("data-act", act);
  if (id != null) el.setAttribute("data-id", id);
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 0);
  return el;
}

/* ------------------------------------------------------------------ routing */
const ROUTES = ["now", "start", "plan", "profiles", "calendar", "planfile", "devices", "health", "settings"];
function go(page) {
  if (ROUTES.indexOf(page) < 0) page = "now";
  state.page = page;
  refreshConfigSoon();
  if (page === "devices") ensurePairing();
  draw();
  const body = document.getElementById("body");
  if (body) body.scrollTop = 0;
}
let drawnHtml = null;
/** Draw the current route. Only the DOM that actually changed is replaced, so scrolling and a text
    selection survive a poll that changed nothing. */
function draw() {
  const body = document.getElementById("body");
  if (!body) return;
  const html = routeHtml();
  if (html !== drawnHtml) {
    drawnHtml = html;
    body.innerHTML = html;
    makeInteractive(body);
  }
  paintNav();
  paintStatusBar();
  announce();
}
const ROUTE_FNS = {
  now: pageNow, start: pageStart, plan: pagePlan, profiles: pageProfiles, calendar: pageCalendar,
  planfile: pagePlanFile, devices: pageDevices, health: pageHealth,
  settings: pageSettings,
};
function routeHtml() {
  const fn = ROUTE_FNS[state.page] || pageNow;
  try { return `<div class="wrapc" data-page-root="${esc(state.page)}">${fn()}</div>`; }
  catch (e) {
    console.error(e);
    return `<div class="wrapc"><h1>This page could not be drawn</h1>
      <div class="sub">The plan and block are unchanged.</div>${sh(16)}<div class="alert bad"><div class="mono">${esc(e && e.message)}</div>
      ${sh(10)}${btn("Go to Now", "goto", ' data-page="now"')}</div></div>`;
  }
}
function paintNav() {
  for (const nav of document.querySelectorAll(".nav")) {
    const on = nav.dataset.page === state.page;
    nav.classList.toggle("on", on);
    if (on) nav.setAttribute("aria-current", "page"); else nav.removeAttribute("aria-current");
  }
  const running = (state.status && state.status.running) || [];
  const nowCount = document.getElementById("nav-now");
  if (nowCount) nowCount.textContent = running.length ? String(running.length) : "";
  const planCount = document.getElementById("nav-plan");
  if (planCount) planCount.textContent = String(enabledWeekly().length + enabledCalendars().length);
}
function paintStatusBar() {
  const host = document.getElementById("statusbar");
  if (!host) return;
  const s = state.status;
  const running = (s && s.running) || [];
  let label, tone, icon;
  if (!s) { label = "No service"; tone = "bad"; icon = "!"; }
  else if (s.hosts_error || s.state_warning || s.foreground_warning) { label = "Degraded"; tone = "warn"; icon = "!"; }
  else { label = "Enforcing"; tone = "ok"; icon = "\u2713"; }
  if (running.length) {
    const ends = running[0].lock ? running[0].lock.ends_at : null;
    const left = ends == null ? null : ends - s.now;
    label += " \u00b7 " + profileName(running[0].profile) + (left == null ? "" : " \u00b7 " + clock(left));
  }
  host.innerHTML = `${stateTag(label, tone, icon)}
    <span class="meta mono" style="white-space:nowrap">${esc(atTime(s ? s.now : Math.floor(Date.now() / 1000)))}</span>`;
}
/** One throttled announcement a minute, never one a second (§8). */
function announce() {
  const s = state.status;
  const host = document.getElementById("live");
  if (!host || !s) return;
  const running = s.running || [];
  if (!running.length) { state.lastAnnouncedMinute = null; return; }
  const ends = running[0].lock ? running[0].lock.ends_at : null;
  if (ends == null) return;
  const minutes = Math.floor(Math.max(0, ends - s.now) / 60);
  if (state.lastAnnouncedMinute === minutes) return;
  state.lastAnnouncedMinute = minutes;
  host.textContent = `${profileName(running[0].profile)} is blocked. ${spellMinutes(minutes)} left.`;
}

/* ==================================================================================================
   Part 4 — Start a block (§5.2): strict three-step order.
   ================================================================================================== */
function startDraft() {
  if (!state.start) {
    state.start = {
      step: 1, strength: "wait", minutes: 90, profile: null, selected: [],
      error: null, saving: false, receipt: false,
    };
  }
  return state.start;
}
/** One line of error, with the raw detail tucked behind a disclosure. */

  return `<div class="err-msg" role="alert"${extra || ""}>${esc(summary)}${more}</div>`;
}

      <div class="h2" style="flex:1">${esc(title)}</div>

function stepTargets() {
  const d = startDraft();

/** The countdown ring. An instrument, not a decoration: one arc, one honest remainder. */

  const px = size || 168, r = (px / 2) - 17, c = 2 * Math.PI * r;
  const share = total > 0 ? Math.max(0, Math.min(1, left / total)) : 0;
  const mid = px / 2;
  let ticks = "";
  for (let i = 0; i < 12; i += 1) {
    const a = (i / 12) * 2 * Math.PI - Math.PI / 2;
    const x1 = mid + Math.cos(a) * (r + 10), y1 = mid + Math.sin(a) * (r + 10);
    const x2 = mid + Math.cos(a) * (r + 14), y2 = mid + Math.sin(a) * (r + 14);
    ticks += `<line class="tick" x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"/>`;
  }
  return `<svg class="ring" width="${px}" height="${px}" viewBox="0 0 ${px} ${px}"
      role="img" aria-label="${esc(caption + ": " + clock(left))}">
    <circle class="trk" cx="${mid}" cy="${mid}" r="${r.toFixed(1)}"/>
    <circle class="arc" cx="${mid}" cy="${mid}" r="${r.toFixed(1)}"
      transform="rotate(-90 ${mid} ${mid})"
      stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${(c * (1 - share)).toFixed(2)}"/>
    ${ticks}
    <text class="ctr" x="${mid}" y="${mid + 3}" text-anchor="middle">${esc(clock(left))}</text>
    <text class="ctr-l" x="${mid}" y="${mid + 21}" text-anchor="middle">${esc(caption)}</text>
  </svg>`;
}

/** Every weekly window that overlaps a range, in absolute times, clipped to the range. */

      if ((rule.days || []).map(Number).indexOf(day) < 0) continue;
      const span = spanOf(rule.start_minute, rule.end_minute, ruleWrap(rule));
      const dayStart = new Date(from.getFullYear(), from.getMonth(), from.getDate() + offset).getTime();
      const bandFrom = dayStart + rule.start_minute * 60000;

  const existed = weeklyRules().concat(calendarRules()).some((r) => r.id === id);
  const config = JSON.parse(JSON.stringify(state.config || {}));
  let item;
  if (e.kind === "weekly") {
    e.id = id;
    item = editorToWeekly(e);
    config.weekly = config.weekly || [];
    const at = config.weekly.findIndex((r) => r.id === id);
    if (at >= 0) {
      item.enabled = config.weekly[at].enabled !== false;
      config.weekly[at] = item;
    } else {
      item.enabled = true;
      config.weekly.push(item);
    }
  } else {
    e.id = id;
    item = {
      id,
      profile: e.profile,
      matcher: Object.assign({}, e.matcher),
      pad_before_seconds: Math.max(0, Math.round(e.leadIn * 60)),
      pad_after_seconds: Math.max(0, Math.round(e.leadOut * 60)),
    };
    const s = strengthById(e.strength);
    item.locks = s.lock ? [s.lock] : [];
    config.calendars = config.calendars || [];
    const at = config.calendars.findIndex((r) => r.id === id);
    if (at >= 0) {
      item.enabled = config.calendars[at].enabled !== false;
      config.calendars[at] = item;
    } else {
      item.enabled = true;
      config.calendars.push(item);
    }
  }
  const running = runningRuleId();
  if (running && running === id) {
    return confirmSheet("This rule is running a block right now",
      `Editing a rule never shortens or weakens a block that is already running. This change is saved,
       and the service applies it once the running block has ended.`,
      "Save it anyway", "rule-save-confirm", "Cancel", "quiet");
  }
  return writeRule(config, e, existed);
}
/** The id of the weekly rule currently running a block, if any. */
function runningRuleId() {
  for (const session of (state.status && state.status.running) || []) {
    if (session.source && session.source.kind === "weekly") return session.source.schedule;
  }
  return null;
}
async function writeRule(config, e, existed) {
  e.saving = true;
  renderEditor();
  const answer = await call({ kind: "save_config_json", config });
  e.saving = false;
  if (!answer.ok) {
    e.error = (answer.detail || "The plan could not be saved.")
      + " Nothing has been changed on disk: the plan the service is enforcing is still what it was.";
    return renderEditor();
  }
  const name = e.id;
  sheet("");
  if (answer.warning) toast("Saved, with a warning", answer.warning, "warn");
  await refresh({ force: true });
  toast("The plan is saved", `${existed ? "Updated" : "Added"} ${name}. The service is reading it now.`, "ok");
}
async function removeRule(id, kind) {
  const config = JSON.parse(JSON.stringify(state.config || {}));
  const key = kind === "calendar" ? "calendars" : "weekly";
  const before = (config[key] || []);
  const rule = before.find((r) => r.id === id);
  if (!rule) return say("That rule is gone", "Nothing was removed.");
  config[key] = before.filter((r) => r.id !== id);
  const answer = await call({ kind: "save_config_json", config });
  if (!answer.ok) return say("That could not be removed", answer.detail || "The plan could not be saved.");
  await refresh({ force: true });
  sheet("");
  toast("Rule removed", `${id} was removed from the plan. A block it had already started keeps running to its own end.`, "ok");
}
async function toggleRule(id, kind) {
  const config = JSON.parse(JSON.stringify(state.config || {}));
  const key = kind === "calendar" ? "calendars" : "weekly";
  const rule = (config[key] || []).find((r) => r.id === id);
  if (!rule) return say("That rule is gone", "Nothing changed.");
  rule.enabled = rule.enabled === false;
  const answer = await call({ kind: "save_config_json", config });
  if (!answer.ok) return say("That could not be changed", answer.detail || "The plan could not be saved.");
  await refresh({ force: true });
  toast(rule.enabled ? "Rule resumed" : "Rule paused",
    rule.enabled ? `${id} can start blocks again.` : `${id} will not start anything new. A running block is untouched.`, "ok");
}
async function applyPreset(id) {
  const preset = presetById(id);
  if (!preset) return;
  if (!profiles().length) return say("No profile yet", "A rule needs a profile to run.");
  const e = emptyEditor("weekly");
  e.name = preset.id;
  e.days = preset.days;
  e.start = preset.start;
  e.end = preset.end;
  e.strength = preset.strength;
  e.profile = profiles()[0].id;
  state.editor = e;
  await saveRule();
}

function ensurePairing() {

async function loadPairing() {
  state.pairing = Object.assign({ loading: true, error: null, peers: null, invite: null, phrase: null,
    transport: null, step: 1, reply: null, replyPhrase: null, receipt: null, server: null },
    state.pairing || {});
  state.pairing.loading = true;
  draw();
  const answer = await askService({ request: "peers" });
  state.pairing.loading = false;
  if (answer.ok && answer.value && answer.value.response === "pairing") {
    state.pairing.peers = peersOf(answer.value.json);
    state.pairing.error = null;
  } else {
    state.pairing.error = (answer.value && answer.value.detail) || answer.detail
      || "The service did not answer, so pairing cannot be shown.";
  }
  draw();
}
/** Mint a fresh invite and show its six digits. */
async function offerPairing() {
  const answer = await askService({ request: "invite" });
  if (!answer.ok || !answer.value || answer.value.response !== "pairing") {
    return say("Could not make a code",
      (answer.value && answer.value.detail) || answer.detail || "The service did not answer.");
  }
  state.pairing = Object.assign({}, state.pairing, { invite: answer.value.json, phrase: null, step: 3 });
  const phrased = await askService({ request: "phrase", invite: answer.value.json });
  if (phrased.ok && phrased.value && phrased.value.response === "pairing") {
    state.pairing.phrase = phrased.value.json;
  }
  return draw();
}
/** Answer a pasted code, show the six digits, and offer what to send back. */
async function answerPairing() {
  const pasted = codeOf(state.pairing && state.pairing.replyText);
  if (!pasted) return say("Nothing to answer", "Paste the code from the other device first.");
  const answer = await askService({ request: "reply", invite: pasted });
  if (!answer.ok || !answer.value || answer.value.response !== "pairing") {
    return say("That code was not readable",
      (answer.value && answer.value.detail) || answer.detail || "The service did not answer.");
  }
  state.pairing = Object.assign({}, state.pairing, { reply: answer.value.json, replyPhrase: null });
  const phrased = await askService({ request: "phrase", invite: answer.value.json });
  if (phrased.ok && phrased.value && phrased.value.response === "pairing") {
    state.pairing.replyPhrase = phrased.value.json;
  }
  return draw();
}
/** A pasted pairing code, as the protocol wants it: the payload without any wrapper. */
function codeOf(text) {
  const raw = String(text || "").trim();
  if (!raw) return "";
  if (raw.slice(0, 5).toLowerCase() === "crfw:") return raw.slice(5).trim();
  if (raw.slice(0, 5).toLowerCase() === "code=") return raw.slice(5).trim();
  return raw;
}
function peersOf(json) {
  try {
    const parsed = JSON.parse(json);
    const map = parsed.devices || parsed || {};
    return Object.entries(map).map(([id, peer]) => Object.assign({ id }, peer));
  } catch (e) { return []; }
}

/** The five steps of §5.7, with the comparison left where it belongs: with the two people reading it. */

    body = `<div class="receipt">

  } else {

/** A plain-language recovery for a document that will not parse. */
function parseRecovery(text, detail, kind) {
  const lower = detail.toLowerCase();
  let clue = "The service rejected the document before writing anything, so the plan on disk is still the one it was enforcing.";
  if (lower.includes("expected") || lower.includes("invalid") || kind === "toml") {
    clue += " The most common causes are a value with the wrong type (a number in quotes), a section "
      + "header written twice, or a list that is missing a closing bracket.";
  }
  if (lower.includes("unknown field")) {
    clue += " A field name that this version of Curfew does not know is refused rather than ignored, "
      + "so a typo shows up here instead of silently doing nothing.";
  }
  if (lower.includes("version") || lower.includes("migrat")) {
    clue += " A plan file written by a newer Curfew can be opened, but not downgraded.";
  }
  const lines = String(text || "").split("\n");
  const suspicious = lines.findIndex((l) => l.trim().endsWith("[") || (l.split("=").length === 2 && l.split("=")[1].trim() === ""));
  if (suspicious >= 0) clue += ` Line ${suspicious + 1} looks unfinished: ${JSON.stringify(lines[suspicious].trim())}.`;
  return clue;
}

function diffCard(p, diff) {

/** A shallow field-level diff of two plan documents, as lines. */
function diffLines(before, after) {
  const out = [];
  const walk = (path, a, b) => {
    if (JSON.stringify(a) === JSON.stringify(b)) {
      if (a !== undefined && (typeof a !== "object" || a === null)) out.push({ kind: "same", text: `${path} = ${JSON.stringify(a)}` });
      return;
    }
    if (a && b && typeof a === "object" && typeof b === "object" && !Array.isArray(a) && !Array.isArray(b)) {
      for (const key of new Set([...Object.keys(a), ...Object.keys(b)])) {
        walk(path ? `${path}.${key}` : key, a[key], b[key]);
      }
      return;
    }
    if (Array.isArray(a) && Array.isArray(b)) {
      if (a.length !== b.length) out.push({ kind: "add", text: `${path}: ${a.length} item(s) before, ${b.length} now` });
      const n = Math.max(a.length, b.length);
      for (let i = 0; i < n; i += 1) walk(`${path}[${i}]`, a[i], b[i]);
      return;
    }
    if (a !== undefined) out.push({ kind: "del", text: `${path} = ${JSON.stringify(a)}` });
    if (b !== undefined) out.push({ kind: "add", text: `${path} = ${JSON.stringify(b)}` });
  };
  walk("", before, after);
  /* Only lines that changed, plus a little context, so the panel stays readable. */
  return out.filter((d) => d.kind !== "same").slice(0, 120);
}
async function saveConfigJsonWith(config, okMessage) {
  const answer = await call({ kind: "save_config_json", config });
  if (!answer.ok) {
    const text = String(answer.detail || "");
    if (text.toLowerCase().includes("invalid") || text.toLowerCase().includes("unknown field")) {
      state.planfile.conflict = {
        detail: text,
        recovery: parseRecovery(state.planfile.importText || state.planfile.text, text, "json"),
      };
      draw();
      return false;
    }
    return { error: answer.detail || "The plan could not be saved." };
  }
  if (answer.warning) toast("Saved, with a warning", answer.warning, "warn");
  if (okMessage) toast("Plan saved", okMessage, "ok");
  await refresh({ force: true });
  return true;
}

/** `activate` is one dispatcher for every control, whether it was clicked or pressed with a key. */
async function activate(target) {
  const act = target.closest ? target.closest("[data-act]") : null;
  if (!act) {
    const nav = target.closest ? target.closest("[data-page]") : null;
    if (nav && nav.dataset.page) go(nav.dataset.page);
    return;
  }
  const a = act.dataset.act;
  const id = act.dataset.id;
  switch (a) {
    case "close": return sheet("");
    case "goto": return go(act.dataset.page);
    case "retry": {
      toast("Trying again", "Asking the service for the current state.", "info");
      return refresh({ force: true });
    }
    case "start-open": return go("start");
    case "start-step": startDraft().step = Number(act.dataset.n); return draw();
    case "start-custom": { const d = startDraft(); d.custom = !d.custom; return draw(); }
    case "pair-open": state.pairOpen = !state.pairOpen; return draw();
    case "start-strength": {
      const d = startDraft();
      d.strength = id;
      if (d.step < 3) d.step = 3;
      return draw();
    }
    case "start-minutes": {
      const d = startDraft();
      d.minutes = Number(act.dataset.minutes);
      if (d.step < 2) d.step = 2;
      return draw();
    }
    case "start-profile": startDraft().profile = id; return draw();
    case "start-go": return startBlock();
    case "open-credential": return finishUnlock(id);
    case "preset": {
      const d = startDraft();
      d.minutes = Number(act.dataset.minutes);
      return draw();
    }
    case "end": return endBlock(id);
    case "end-confirm": return endBlock(id, [{ kind: "confirm" }]);
    case "unlock": return finishUnlock(id);
    case "which-rule": return whichRule(id);
    case "release-ask": return confirmSheet("Release this block from this device?",
      "This device is the one the lock asks. The release goes out to your other devices and "
      + "<b>cannot be withdrawn</b> \u2014 the block lifts everywhere.", "Release it", "release", "Cancel", "warn");
    case "release": {
      const answer = await askService({ request: "release", id });
      if (!answer.ok) return say("The service did not answer", answer.detail);
      if (answer.value && answer.value.response === "refused") say("Not released", describeRefusal(answer.value.refusal));
      return refresh({ force: true });
    }
    case "delayed-ask": return confirmSheet("Start the 24-hour release?",
      "This is the exit of last resort, and it is deliberately slow. The block lifts at this time "
      + "tomorrow, and <b>that cannot be brought forward or cancelled</b>.", "Start it", "request-release", "Not yet", "warn");
    case "request-release": {
      const answer = await askService({ request: "request_release", id });
      if (!answer.ok) return say("The service did not answer", answer.detail);
      if (answer.value && answer.value.response === "refused") say("Not started", describeRefusal(answer.value.refusal));
      return refresh({ force: true });
    }
    case "cancel-freeze": return cancelFreeze(id);
    case "dismiss-downtime": {
      await askService({ request: "dismiss_downtime" });
      return refresh({ force: true });

/** Ending a block: the service is always the judge, and this window only offers what it is told. */
async function endBlock(id, satisfied) {
  const answer = await askService({ request: "end", id, satisfied: satisfied || [] });
  if (!answer.ok) return say("The service did not answer", answer.detail || IN_FLIGHT_DETAIL);
  const value = answer.value || {};
  if (value.response === "ok") { await refresh({ force: true }); return sheet(""); }
  if (value.response === "error") return say("That could not be done", value.detail);
  if (value.response === "refused") {
    const missing = value.refusal.refusal === "locked" ? (value.refusal.missing || []) : [];
    if (missing.some((l) => lockKind(l) === "device_credential")) return askCredential(id);
    if (missing.some((l) => lockKind(l) === "confirm")) {
      return confirmSheet("End this block?", "You asked to be asked. Nothing else is standing in the way.",
        "End it", "end-confirm", "Keep it running", "warn");
    }
    return say("Still holding", describeRefusal(value.refusal));
  }
  return say("The service said", describeUnknown(value));
}
/** Which rule this is: the question a person asks the moment a block surprises them. */
function whichRule(id) {
  const session = ((state.status && state.status.running) || []).find((x) => x.id === id);
  if (!session) return say("That block is not running", "It ended between the click and this sentence.");
  const source = session.source || { kind: "manual" };
  let detail = "It was started by hand from the Start a block screen. No rule is responsible for it, "
    + "and no rule will end it: it ends when its own time is up or you end it.";
  if (source.kind === "weekly") {
    const rule = weeklyRules().find((r) => r.id === source.schedule);
    detail = rule
      ? `A weekly window started it: ${windowSentence(rule)}. Profile ${profileName(rule.profile)}. `
        + `It will end with the window, or when the block's own end time is reached.`
      : `The weekly rule named "${source.schedule}" is not in the plan file any more. The block it `
        + `started keeps running to its own end \u2014 deleting a rule cannot shorten a promise.`;
  } else if (source.kind === "calendar") {
    detail = `A calendar rule started it, matching the event "${source.event}". The rule that matched is `
      + `"${source.schedule}", and its lead-in and lead-out are what decide when the block starts and stops.`;
  }
  sheet(`<div class="wrap" style="line-height:1.6;color:var(--mut)">${esc(detail)}</div>
    <div class="sheetfoot">${btn("Open the plan", "goto", ' data-page="plan"', "ghost")}
      <button class="btn" data-act="close">Close</button></div>`, { title: "Which rule is this?" });

/** What came back from the system prompt, once the host has shown it. */
async function finishUnlock(id) {
  const answer = await askUnlock(id);
  sheet("");
  if (!answer.ok) return say("The service did not answer", answer.detail || IN_FLIGHT_DETAIL);
  const value = answer.value || {};
  /* A cancelled prompt is not a failure: the user closed the dialog, so nothing is said and the block
     stays locked, which is what closing it meant. */
  if (value.response === "cancelled") return;
