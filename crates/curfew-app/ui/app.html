  if (wrap.dataset.dialMode === "duration") {
    const box = svg.getBoundingClientRect();
    const radius = Math.hypot(((event.clientX - box.left) / box.width) * DIAL_BOX - DIAL_MID,
      ((event.clientY - box.top) / box.height) * DIAL_BOX - DIAL_MID);
    ring = radius >= (R_OUT + R_IN) / 2 ? "hour" : "minute";
  }
  dialPointerDown(event, svg, wrap.dataset.dial, ring);
});
async function changeTargetAction(el) {
  const profile = profiles().find((p) => p.id === el.dataset.profile);
  if (!profile) return;
  const config = JSON.parse(JSON.stringify(state.config));
  const target = config.profiles.find((p) => p.id === profile.id);
  const rule = target.rules[Number(el.dataset.index)];
  if (!rule) return;
  const kind = el.value;
  if (kind === "budget") rule.action = { kind: "budget", seconds: 1800, refill: { kind: "daily" } };
  else if (kind === "delay") rule.action = { kind: "delay", seconds: 30 };
  else if (kind === "launch_limit") rule.action = { kind: "launch_limit", count: 5, refill: { kind: "daily" } };
  else rule.action = { kind };
  const result = await saveConfigJsonWith(config, "What happens to that target has changed.");
  if (result && result.error) return say("That could not be changed", result.error);
}

/**
 * Enter and Space, on anything that is meant to be a button, Escape for the sheet, and the command
 * palette's own keys. One handler, so a control cannot be reachable by one input method and not the
 * other, and the dial gets its arrow keys on the way past.
 */
document.addEventListener("keydown", (event) => {
  const mod = event.ctrlKey || event.metaKey;
  if (mod && (event.key === "k" || event.key === "K")) {
    event.preventDefault();
    return openPalette();
  }
  if (event.key === "Escape") {
    /* Still locked: the sheet owns Escape first, and the palette is a sheet. */
    if (document.getElementById("modal").innerHTML) {
      event.preventDefault();
      sheet("");
    }
    return;
  }
  /* The dial takes its own keys first, even inside a sheet, or the only way to set a time would be
     a pointer. `trapTab` still runs afterwards, so Tab can never leave the dialog. */
  if (ruleDialKeydown(event)) return;
  if (document.getElementById("modal").innerHTML) {
    if (event.key === "Tab") return trapTab(event);
    if (state.editor && event.key === "Enter" && event.target && event.target.tagName !== "BUTTON"
      && event.target.dataset && event.target.dataset.field === "name") {
      event.preventDefault();
      return saveRule();
    }
    return;
  }
  /* The command palette's list, once it is open. */
  if (state.palette && document.getElementById("pl-input")) {
    const matches = paletteMatches();
    if (event.key === "ArrowDown") {
      event.preventDefault();
      state.palette.index = Math.min(matches.length - 1, state.palette.index + 1);
      return renderPalette();
    }
    if (event.key === "ArrowUp") {
      event.preventDefault();
      state.palette.index = Math.max(0, state.palette.index - 1);
      return renderPalette();
    }
    if (event.key === "Enter") {
      event.preventDefault();
      return runPalette(state.palette.index);
    }
  }
  if (event.key !== "Enter" && event.key !== " " && event.key !== "Spacebar") return;
  const target = event.target.closest ? event.target.closest('[data-act], [data-page], [data-tab]') : null;
  /* A real button or input already activates itself, and would otherwise fire twice. */
  if (!target || target.tagName === "BUTTON" || target.tagName === "INPUT") return;
  event.preventDefault();
  activate(target);
});
document.addEventListener("input", (event) => {
  const el = event.target;
  if (el && el.id === "pl-input") {
    state.palette.q = el.value;
    state.palette.index = 0;
    return renderPalette();
  }
});
document.addEventListener("click", (event) => {
  const el = event.target && event.target.closest ? event.target.closest("[data-pl]") : null;
  if (!el) return;
  return runPalette(Number(el.dataset.pl));
});
document.getElementById("palette-open").addEventListener("click", () => openPalette());

/**
 * Anything tappable must be reachable and must announce itself as tappable.
 *
 * Applied once per redraw rather than written into the markup: the nav is static and the rows are
 * regenerated, so an attribute typed by hand in one place would simply be missing in the other.
 */
function makeInteractive(root) {
  for (const el of root.querySelectorAll("[data-act], [data-page], [data-tab], [data-pl]")) {
    if (el.tagName === "BUTTON" || el.tagName === "INPUT" || el.tagName === "SELECT") continue;
    el.setAttribute("role", "button");
    if (!el.hasAttribute("tabindex")) el.setAttribute("tabindex", "0");
  }
  for (const nav of root.querySelectorAll(".nav")) {
    nav.setAttribute("aria-current", nav.classList.contains("on") ? "page" : "false");
  }
}
/** One re-render after the first paint, so the nav counts and the bar are never empty on open. */
makeInteractive(document);
go("now");
</script>
</body>
