<script src="./support.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
 --bg:#0D1016; --sur:#161B23; --sur2:#1D242E; --line:#2A3341;
 --tx:#EDF1F7; --mut:#8D9AAC; --dim:#5D6879;
 --acc:#7C9CF5; --live:#F2A65A; --ok:#5FD3A6; --bad:#F27272;
 --r-card:22px; --r-ctl:14px;
 --f:-apple-system,"Segoe UI",Roboto,Inter,sans-serif;
}
body{width:390px;height:844px;background:var(--bg);color:var(--tx);font-family:var(--f);
 -webkit-font-smoothing:antialiased;overflow:hidden;position:relative}
.status{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:13px;font-weight:600;color:var(--tx);letter-spacing:.2px}
.body{padding:0 20px;height:calc(844px - 44px - 86px);overflow:hidden}
h1{font-size:28px;font-weight:700;letter-spacing:-.6px;line-height:1.15}
.sub{font-size:14px;color:var(--mut);line-height:1.45;margin-top:6px}
.card{background:var(--sur);border:1px solid var(--line);border-radius:var(--r-card);padding:18px}
.lbl{font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--dim)}
.btn{height:52px;border-radius:var(--r-ctl);background:var(--acc);color:#0D1016;font-size:16px;font-weight:650;display:flex;align-items:center;justify-content:center;border:none;width:100%;font-family:var(--f)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--tx)}
.pill{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:999px;font-size:12px;font-weight:600;background:var(--sur2);color:var(--mut)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--live)}
.tabs{position:absolute;bottom:0;left:0;right:0;height:86px;background:rgba(13,16,22,.92);border-top:1px solid var(--line);display:flex;align-items:flex-start;padding:12px 8px 0}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--dim);font-size:11px;font-weight:600}
.tab.on{color:var(--tx)}
.tab .ic{width:26px;height:26px;display:grid;place-items:center}
.tab.on .ic{background:var(--sur2);border-radius:9px;width:44px;height:30px}
svg{display:block}
</style>
<div class="status"><span>9:41</span><span style="display:flex;gap:6px;align-items:center;color:var(--mut);font-size:11px">
<svg width="16" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1" opacity=".4"/></svg>
<svg width="24" height="12" viewBox="0 0 26 12" fill="none" stroke="currentColor"><rect x=".5" y=".5" width="21" height="11" rx="3.5"/><rect x="2.5" y="2.5" width="14" height="7" rx="2" fill="currentColor"/><path d="M24 4.5v3" stroke-width="2" stroke-linecap="round"/></svg></span></div>

<div class="body">
  <div style="height:14px"></div>
  <div class="pill" style="background:rgba(242,166,90,.14);color:var(--live)"><span class="dot"></span>Blocking now</div>
  <div style="height:14px"></div>
  <h1>Deep work</h1>
  <div class="sub">Started 20:00 &middot; from your calendar</div>

  <div style="height:22px"></div>
  <div class="card" style="padding:22px;display:flex;flex-direction:column;align-items:center;gap:18px">
    <div style="position:relative;width:196px;height:196px">
      <svg width="196" height="196" viewBox="0 0 196 196" style="transform:rotate(-90deg)">
        <circle cx="98" cy="98" r="86" fill="none" stroke="#232B36" stroke-width="11"/>
        <circle cx="98" cy="98" r="86" fill="none" stroke="#F2A65A" stroke-width="11"
          stroke-linecap="round" stroke-dasharray="540" stroke-dashoffset="205"/>
      </svg>
      <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center">
        <div style="font-size:46px;font-weight:700;letter-spacing:-1.6px;line-height:1">1:12</div>
        <div style="font-size:14px;color:var(--mut);margin-top:4px">left &middot; ends 22:00</div>
      </div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">
      <span class="pill">18 apps</span>
      <span class="pill">4 sites</span>
      <span class="pill">Phone + PC</span>
    </div>
  </div>

  <div style="height:18px"></div>
  <div class="card" style="padding:16px 18px;display:flex;gap:12px;align-items:flex-start">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8D9AAC" stroke-width="1.8" style="flex:none;margin-top:1px"><rect x="4" y="10" width="16" height="10" rx="3"/><path d="M8 10V7a4 4 0 018 0v3"/></svg>
    <div>
      <div style="font-size:14px;font-weight:600">Locked until it ends</div>
      <div style="font-size:13px;color:var(--mut);margin-top:3px;line-height:1.45">A lock is a promise. You can spend an emergency pass &mdash; you have 2 left this month.</div>
    </div>
  </div>
  <div style="height:12px"></div>
  <button class="btn ghost" style="height:46px;font-size:15px">Use an emergency pass</button>
</div>
<div class="tabs">
 <div class="tab on"><div class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v6c0 4.4-3 8.1-7 9-4-.9-7-4.6-7-9V6z"/></svg></div>Today</div>
 <div class="tab "><div class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="4"/><path d="M8 3v4M16 3v4M3 11h18"/></svg></div>Plan</div>
 <div class="tab "><div class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3.5" y="3.5" width="7" height="7" rx="2.2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2.2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2.2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2.2"/></svg></div>Apps</div>
 <div class="tab "><div class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/><circle cx="9" cy="7" r="2.4" fill="var(--bg)"/><circle cx="15" cy="12" r="2.4" fill="var(--bg)"/><circle cx="8" cy="17" r="2.4" fill="var(--bg)"/></svg></div>Settings</div>
</div>
