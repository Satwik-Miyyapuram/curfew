name: Release

# Builds the Windows binaries for both architectures anyone actually runs Windows on and the
# Android APK, publishes them with checksums, and prints the manifests that winget and scoop want. Everything here is
# reproducible from a tag: a release nobody can rebuild is a binary users are asked to trust on
# faith, which is exactly what an AGPL blocker should not be asking for (GAPS B1).

on:
  push:
    tags: ["v*"]
  # So the whole path can be exercised without cutting a release.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: windows (${{ matrix.target }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
          - target: aarch64-pc-windows-msvc
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      # ARM64 is cross-compiled and cannot be run here, so it is built but not tested. The x64
      # runner tests everything, and the engine is the same code on both.
      - name: Test
        if: matrix.arch == 'x64'
        run: cargo test --all-features

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p curfew-svc -p curfew-tray

      - name: Stage
        shell: bash
        run: |
          set -euo pipefail
          out="curfew-${{ matrix.arch }}"
          mkdir "$out"
          cp "target/${{ matrix.target }}/release/curfew.exe" "$out/"
          cp "target/${{ matrix.target }}/release/curfew-tray.exe" "$out/"
          cp LICENSE README.md "$out/" 2>/dev/null || true
          cp packaging/windows/INSTALL.txt "$out/"
          7z a -tzip "$out.zip" "$out" >/dev/null
          # Checksums beside the archive, so a download can be verified without trusting the page
          # it came from.
          sha256sum "$out.zip" > "$out.zip.sha256"
          cat "$out.zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: curfew-${{ matrix.arch }}
          path: |
            curfew-${{ matrix.arch }}.zip
            curfew-${{ matrix.arch }}.zip.sha256

  android:
    name: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: gradle/actions/setup-gradle@v4

            # The policy module builds the core for four Android ABIs through `cargo ndk`. It is not part
      # of a Rust toolchain, so the runner has to be told to fetch it; pinned, because a build tool
      # that changes under us is a failure nobody can reproduce.
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: Test
        working-directory: android
        run: ./gradlew --no-daemon :policy:testDebugUnitTest :app:testDebugUnitTest

      - name: Build
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleRelease

      # The APK is unsigned on purpose. Signing keys are a cost and a secret to hold, and this
      # project has neither (GAPS D6); an unsigned build a user signs themselves, or installs
      # from a build they made, is honest about that. The checksum is what makes the download
      # verifiable without trusting the page it came from.
      - name: Stage
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find android -path '*/outputs/apk/release/*.apk' | head -1)
          test -n "$apk"
          cp "$apk" curfew-android-unsigned.apk
          sha256sum curfew-android-unsigned.apk > curfew-android-unsigned.apk.sha256
          cat curfew-android-unsigned.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: curfew-android
          path: |
            curfew-android-unsigned.apk
            curfew-android-unsigned.apk.sha256

  publish:
    name: publish
    needs: [windows, android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect
        shell: bash
        run: |
          set -euo pipefail
          mkdir release
          find artifacts -type f -exec cp {} release/ \;
          cd release
          # One file with every checksum in it, which is what a package manifest quotes.
          cat *.sha256 > SHA256SUMS
          ls -l

      - name: Package manifests
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          python3 packaging/manifests.py "$version" release > release/MANIFESTS.md
          cat release/MANIFESTS.md

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          body_path: packaging/windows/RELEASE_NOTES.md
          fail_on_unmatched_files: true
