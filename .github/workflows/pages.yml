name: Pages

# Publishes docs/site to GitHub Pages.
#
# GitHub Pages is the whole hosting plan: no custom domain, no server, nothing with a renewal date
# (GAPS D6). The site is one static file with no build step, so this workflow only fills in the
# repository name and uploads it — there is no generator whose version can rot.

on:
  push:
    branches: [main]
    paths:
      - "docs/site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A queued run should publish the newest commit, but never cancel a deploy already in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The page links to the repository's own releases and docs. Writing the owner and name in by
      # hand would break on a fork, and hard-coding a URL nobody owns yet would ship dead links.
      - name: Fill in the repository
        run: |
          set -euo pipefail
          sed -i "s|__REPO__|${GITHUB_REPOSITORY}|g" docs/site/index.html
          ! grep -q "__REPO__" docs/site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site
      - id: deploy
        uses: actions/deploy-pages@v4
