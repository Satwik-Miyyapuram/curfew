name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  core:
    name: core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features
      - name: Test
        run: cargo test --all-features
      # The engine must decide identically on every platform, which is the whole point of putting
      # it in a shared core. Same config, same answer, Linux and Windows.
      - name: Cross-platform agreement on the golden config
        shell: bash
        run: |
          cfg=crates/curfew-core/tests/golden/example.toml
          # A fixed instant: the answers must not depend on when CI happened to run.
          at=1788609600 # 2026-09-04T12:00:00Z, a Friday
          run() { cargo run --quiet -p curfew-svc -- decide "$cfg" "$1" "$2" --at "$at" "${@:3}"; }
          expect() {
            got=$(run "$1" "$2" "${@:4}")
            if [ "$got" != "$3" ]; then
              echo "decide $1 $2 ${*:4} -> '$got', expected '$3'" >&2
              exit 1
            fi
          }

          cargo run --quiet -p curfew-svc -- check "$cfg"

          expect deep-work app:com.example.notes            "allow"
          expect deep-work app:com.slack                    "delay 15s"
          expect deep-work "url:https://www.youtube.com/shorts/x" "block (Blocked { profile: \"deep-work\" })"
          expect deep-work domain:reddit.com                "allow"
          expect deep-work domain:reddit.com                "block (BudgetExhausted { profile: \"deep-work\", seconds: 1200 })" --used 1200
          expect deep-work app:com.twitter.android          "allow" --opens 2
          expect deep-work app:com.twitter.android          "block (LaunchLimitReached { profile: \"deep-work\", count: 3 })" --opens 3
          expect deep-work notif:com.whatsapp               "mute"
          expect deep-work exe:steam.exe                    "block (Blocked { profile: \"deep-work\" })" --platform windows
          expect deep-work exe:steam.exe                    "allow"                                      --platform android
          expect writing   app:com.example.editor           "allow"
          expect writing   app:com.instagram.android        "block (NotAllowlisted { profile: \"writing\" })"

          # Migration is lossless in the sense that matters: the migrated v0 document decides the
          # same way the v1 one does about the rules they share.
          v0=crates/curfew-core/tests/golden/v0_example.toml
          cargo run --quiet -p curfew-svc -- migrate "$v0" > /tmp/migrated.toml
          cargo run --quiet -p curfew-svc -- check /tmp/migrated.toml

  android:
    name: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@stable
        with:
          # The unit tests load the real core through JNA, so the host needs a matching library as
          # well as the four Android targets the APK packages.
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        working-directory: android
        run: ./gradlew --no-daemon :policy:testDebugUnitTest :app:testDebugUnitTest
      # The release build is where the shrinker gets a vote: a keep rule that is missing here is a
      # crash on a user's device and nowhere else.
      - name: Release build
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: curfew-release-apk
          path: android/**/outputs/apk/release/*.apk
          if-no-files-found: error
